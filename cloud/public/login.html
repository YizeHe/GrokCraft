<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · Grokcraft</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; child-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; worker-src https://challenges.cloudflare.com"
    />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="/">
          <img src="/favicon.svg" alt="" />
          Grokcraft
        </a>
        <nav class="nav-links">
          <a class="btn ghost" href="#download" id="nav-download">Download</a>
          <a class="btn ghost" href="#donate" id="nav-donate">Donate</a>
          <a class="btn" href="/register">创建账号</a>
        </nav>
      </header>
      <div class="auth-wrap">
        <form class="auth-card" id="form" data-mode="login">
          <h1>登录</h1>
          <p class="sub">进入 Grokcraft，连接已授权的电脑。</p>
          <div class="field">
            <label for="email">邮箱</label>
            <input id="email" name="email" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <p class="err" id="err"></p>
          <div class="turnstile-slot">
            <div
              class="cf-turnstile"
              data-sitekey="0x4AAAAAAE7-fWDTJ6p5jxGu"
              data-theme="dark"
              data-size="flexible"
              data-action="turnstile-spin-v1"
            ></div>
          </div>
          <button class="btn block" type="submit">登录</button>
          <p class="legal">注册或登录即表明您已同意<a href="/terms" target="_blank" rel="noopener">《用户协议》</a></p>
          <p class="hint">没有账号？<a href="/register">创建账号</a></p>
        </form>
      </div>
    </div>
    <script type="module" src="/js/site.js"></script>
    <script type="module" src="/js/auth-pages.js"></script>
  </body>
</html>
