[package]
name = "xai-grokcraft"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"

[dependencies]
anyhow = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
