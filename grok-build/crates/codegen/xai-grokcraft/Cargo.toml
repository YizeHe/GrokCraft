tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
whoami = { workspace = true }
xai-dirs = { workspace = true }
xai-grok-version = { workspace = true }
